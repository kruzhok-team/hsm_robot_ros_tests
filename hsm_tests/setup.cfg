[develop]
script_dir=$base/lib/hsm_tests
[install]
install_scripts=$base/lib/hsm_tests

[tool:pytest]
markers =
    linter: the L0 tier - the coding style of the package
    unit: the L1 tier - the modules of the runners alone, with no ROS graph
    integration: the L3 tier - the API nodes driven against the fake robot node
    system: the L4 tier - the whole pipeline driven against the turtlesim simulator
