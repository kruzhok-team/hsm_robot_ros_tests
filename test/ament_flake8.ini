# The flake8 configuration of the Cyberiada HSM-to-ROS2 framework.
#
# The file replaces the default ament_flake8 configuration entirely, so it repeats
# the default settings and changes two of them:
#
# * max-line-length is raised from 99 to 120 - the sources of the framework are
#   written with the longer lines;
# * the import ordering (I100, I101, I201) and the quote style (Q000) checks are
#   disabled - the framework does not follow the ament conventions here.
#
# Everything else is left as ament defines it.

[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,I100,I101,I201,Q000
import-order-style = google
max-line-length = 120
show-source = true
statistics = true
# flake8 checks the files in parallel by forking, and under colcon the tests run in a
# worker thread, so the timeout plugin holds a timer thread while the fork happens -
# which Python reports as a possible deadlock. The projects are small enough to be
# checked by one process.
jobs = 1
